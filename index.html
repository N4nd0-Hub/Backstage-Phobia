function currentRecords(){let records=db.records.filter(r=>ui.page==='trash'?r.deleted:ui.page==='archive'?r.archived&&!r.deleted:!r.archived&&!r.deleted);if(!ui.query.trim()&&TYPES[ui.page])records=records.filter(r=>r.type===ui.page);if(!ui.query.trim()&&ui.page==='favorites')records=records.filter(r=>r.favorite);if(!ui.query.trim()&&ui.page==='folder')records=records.filter(r=>r.folder===ui.folder);const query=normalize(ui.query).trim();if(query)records=records.filter(r=>normalize([r.title,r.subtitle,r.summary,r.body,r.secret,...r.tags,...Object.values(r.fields)].join(' ')).includes(query));if(ui.status!=='all')records=records.filter(r=>r.status===ui.status);if(ui.tag!=='all')records=records.filter(r=>r.tags.includes(ui.tag));records.sort(ui.sort==='title'?(a,b)=>a.title.localeCompare(b.title,'pt-BR'):ui.sort==='created'?(a,b)=>b.createdAt.localeCompare(a.createdAt):(a,b)=>b.updatedAt.localeCompare(a.updatedAt));return records}

sualizar cartões" aria-pressed="${view==='cards'}">${icon('grid')}</button><button class="${view==='list'?'active':''}" data-view="list" aria-label="Visualizar lista" aria-pressed="${view==='list'}">${icon('menu')}</button>${ui.page==='arc'?`<button class="${view==='board'?'active':''}" data-view="board" aria-pressed="${view==='board'}">Quadro</button>`:''}${ui.page==='session'?`<button class="${view==='timeline'?'active':''}" data-view="timeline" aria-pressed="${view==='timeline'}">Linha do tempo</button>`:''}</div><span class="result-count">${records.length} ${records.length===1?'REGISTRO':'REGISTROS'}</span></div>${!records.length?`<div class="empty">${icon(query?'search':type?.icon||'archive')}<h2>${query||ui.status!=='all'||ui.tag!=='all'?'Nada por aqui com esse filtro.':ui.page==='trash'?'Nada na lixeira.':'A próxima ideia começa aqui.'}</h2><p>${query?'Tente um nome, trecho do texto ou tag.':ui.page==='trash'?'Os registros removidos podem ser restaurados por aqui.':'Crie um registro para guardar e conectar esta parte da sua história.'}</p>${query||ui.status!=='all'||ui.tag!=='all'?'<button class="btn" data-action="clear-filters">Limpar busca e filtros</button>':ui.page!=='trash'?'<button class="btn primary" data-action="new">'+icon('plus')+' Criar registro</button>':''}</div>`:view==='board'?board(records):view==='timeline'?timeline(records):view==='list'?`<div class="listview">${records.map(listRecord).join('')}</div>`:`<div class="cards">${records.map(card).join('')}</div>`}`}
function pill(r){return `<span class="status-pill" data-status="${r.status}"><i></i>${STATUS[r.status]}</span>`}
function card(r){return `<article class="record-card"><div class="cover ${r.type}">${r.image?`<img src="${r.image}" alt="" loading="lazy"><span class="cover-overlay"></span>`:`<span class="cover-symbol">${icon(r.type)}</span>`}<span class="type-tag">${TYPES[r.type].one.toUpperCase()}</span><span class="cover-code">PHOBIA / ${r.type.toUpperCase()}</span><button class="card-fav ${r.favorite?'on':''}" data-favorite="${r.id}" aria-label="${r.favorite?'Retirar dos':'Adicionar aos'} favoritos: ${esc(r.title)}" aria-pressed="${r.favorite}">${icon('star')}</button></div><div class="card-body"><button class="card-title" data-open="${r.id}">${esc(r.title)}</button><div class="card-subtitle">${esc(r.subtitle||TYPES[r.type].hint)}</div><p class="card-description">${esc(r.summary||'Um espaço para esta parte da história.')}</p><div class="tags">${r.example?'<span class="tag example">EXEMPLO</span>':''}${r.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="card-bottom">${pill(r)}<button class="card-open" data-open="${r.id}">ABRIR ↗</button></div></div></article>`}
function listRecord(r){return `<article class="list-record">${icon(r.type)}<div><button class="card-title" data-open="${r.id}">${esc(r.title)}</button><small>${TYPES[r.type].one}${r.subtitle?' · '+esc(r.subtitle):''}${r.example?' · EXEMPLO':''}</small></div>${pill(r)}<button class="icon-btn" data-favorite="${r.id}" aria-label="Alternar favorito: ${esc(r.title)}" aria-pressed="${r.favorite}" style="${r.favorite?'color:var(--hot)':''}">${icon('star')}</button><button class="icon-btn" data-open="${r.id}" aria-label="Abrir ${esc(r.title)}">${icon('arrow')}</button></article>`}
function board(records){const groups=[['planejado','NO RADAR',['planejado','rascunho','estabelecido']],['ativo','EM CENA',['ativo','pausado']],['concluido','CONCLUÍDOS',['concluido']]];return `<div class="board">${groups.map(([key,label,statuses],i)=>{const rs=records.filter(r=>statuses.includes(r.status));return `<section class="board-col"><div class="board-title"><span>${label}</span><b>${rs.length}</b></div>${rs.length?rs.map(r=>card(r)+`<div class="board-move">${i>0?`<button class="btn small" data-move="${r.id}" data-status="${groups[i-1][0]}">← ${i===1?'Planejar':'Reabrir'}</button>`:''}${i<2?`<button class="btn small" data-move="${r.id}" data-status="${groups[i+1][0]}">${i===0?'Entrar em cena':'Concluir'} →</button>`:''}</div>`).join(''):'<div class="board-empty">Os arcos chegam aqui<br>conforme a história avança.</div>'}</section>`}).join('')}</div>`}
function timeline(records){return `<div class="timeline">${[...records].sort((a,b)=>(a.fields.date||'9999').localeCompare(b.fields.date||'9999')||Number(a.fields.number||0)-Number(b.fields.number||0)).map(r=>`<div class="timeline-item"><time>${r.fields.date?fmtDate(r.fields.date):'DATA A DEFINIR'}${r.fields.number?' / SESSÃO '+esc(r.fields.number):''}</time><article class="record-card"><button class="card-title" data-open="${r.id}">${esc(r.title)}</button><p>${esc(r.summary||r.fields.recap||'Abra para preparar ou registrar esta sessão.')}</p>${pill(r)}<button class="card-open" style="float:right" data-open="${r.id}">ABRIR ↗</button></article></div>`).join('')}</div>`}
function connectionsPage(){const all=activeRecords(),clusters=all.filter(r=>r.links.some(l=>all.some(t=>t.id===l.target)));return heading('Um fio puxa outro.','As relações que você escreveu entre pessoas, mistérios e acontecimentos. Abra um registro para adicionar uma conexão.','CAMPANHA / CONEXÕES')+(clusters.length?`<div class="graph-list">${clusters.map(r=>`<section class="connection-cluster"><div class="source">${icon(r.type)}<button class="text-link" style="font-size:15px" data-open="${r.id}">${esc(r.title)}</button></div><div class="targets">${r.links.map(l=>{const t=all.find(x=>x.id===l.target);return t?`<div><small>${esc(l.label)} →</small>${icon(t.type)}<button class="text-link" data-open="${t.id}">${esc(t.title)}</button></div>`:''}).join('')}</div></section>`).join('')}</div>`:`<div class="empty">${icon('link')}<h2>As peças ainda estão soltas.</h2><p>Abra qualquer registro, entre em Conexões e ligue-o a outra parte da campanha.</p><button class="btn primary" data-nav="all">Explorar arquivo</button></div>`)}
function formatInline(text){return esc(text).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)<>]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1 ↗</a>')}
function markdown(text){let out='',list=false,para=[];const flush=()=>{if(para.length){out+='<p>'+para.map(formatInline).join('<br>')+'</p>';para=[]}if(list){out+='</ul>';list=false}};for(const line of String(text||'').split('\n')){if(/^#{1,3} /.test(line)){flush();const level=line.startsWith('### ')?3:2;out+=`<h${level}>${formatInline(line.replace(/^#{1,3} /,''))}</h${level}>`}else if(/^[-*] /.test(line)){if(para.length){out+='<p>'+para.map(formatInline).join('<br>')+'</p>';para=[]}if(!list){out+='<ul>';list=true}out+='<li>'+formatInline(line.slice(2))+'</li>'}else if(/^> /.test(line)){flush();out+='<blockquote>'+formatInline(line.slice(2))+'</blockquote>'}else if(!line.trim())flush();else{if(list){out+='</ul>';list=false}para.push(line)}}flush();return out}
function openEditor(id,tab='record'){if(editMode)commitDraft();const r=byId(id);if(!r)return;returnFocus=document.activeElement;editId=id;editMode=false;editorTab=tab;draft=null;drawEditor();$('editor').querySelector('.drawer').focus()}
function drawEditor(){const r=byId(editId);if(!r){$('editor').innerHTML='';return}const deleted=r.deleted;$('editor').innerHTML=`<div class="overlay" data-overlay="editor"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(r.title)}" tabindex="-1"><div class="drawer-top"><div><div class="eyebrow">${TYPES[r.type].one.toUpperCase()} / ${r.example?'EXEMPLO DE REGISTRO':'ARQUIVO DO MESTRE'}</div><div class="drawer-saved">${deleted?'NA LIXEIRA':r.archived?'ARQUIVADO':editMode?'Edição com salvamento automático':'Editado em '+fmtDate(r.updatedAt)}</div></div>${!deleted?`<button class="icon-btn" data-action="editor-favorite" aria-label="Alternar favorito" aria-pressed="${r.favorite}" style="${r.favorite?'color:var(--hot)':''}">${icon('star')}</button><button class="btn ${editMode?'primary':''}" data-action="edit-toggle">${icon(editMode?'check':'edit')}${editMode?'Concluir edição':'Editar'}</button>`:''}<button class="icon-btn" data-action="editor-close" aria-label="Fechar registro">${icon('close')}</button></div><nav class="drawer-tabs" aria-label="Seções do registro">${[['record','Registro'],['links','Conexões'],['tasks','Preparação']].map(([key,name])=>`<button class="${editorTab===key?'active':''}" data-editor-tab="${key}" aria-current="${editorTab===key?'page':'false'}">${name}${key==='links'?' · '+(r.links.length+db.records.filter(x=>!x.deleted&&x.id!==r.id&&x.links.some(l=>l.target===r.id)).length):key==='tasks'?' · '+r.tasks.length:''}</button>`).join('')}</nav><div class="drawer-content">${deleted?'<div class="demo-notice">Este registro está na lixeira. Restaure para continuar a edição.</div>':''}${editorTab==='record'?(editMode?editForm(draft||r):readRecord(r)):editorTab==='links'?linksPanel(r):tasksPanel(r)}</div><div class="drawer-bottom">${deleted?`<button class="btn primary" data-action="record-restore">${icon('archive')} Restaurar registro</button>`:`<button class="btn" data-action="record-duplicate" title="Criar uma cópia">${icon('copy')} Duplicar</button><button class="btn" data-action="record-archive">${icon('archive')}${r.archived?'Desarquivar':'Arquivar'}</button>`}<span class="spacer"></span>${!deleted?`<button class="btn danger" data-action="record-delete" aria-label="Mover registro para a lixeira">${icon('trash')}</button>`:''}<button class="btn" data-action="editor-close">Fechar</button></div></section></div>`}
function readRecord(r){const fields=TYPES[r.type].fields.filter(([key])=>r.fields[key]);return `<div class="read-header"><div>${pill(r)}<h2>${esc(r.title)}</h2>${r.subtitle?`<p>${esc(r.subtitle)}</p>`:''}<div class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${r.example?'<span class="tag example">EXEMPLO</span>':''}</div>${r.folder?`<div class="folder-tag" style="margin-top:12px">${icon('folder')}${esc(r.folder)}</div>`:''}</div>${r.image&&r.type==='npc'?`<img class="detail-photo" src="${r.image}" alt="Retrato de ${esc(r.title)}">`:''}</div>${r.image&&r.type!=='npc'?`<img class="read-cover" src="${r.image}" alt="Imagem de ${esc(r.title)}">`:''}${r.summary?`<div class="summary-block">${esc(r.summary)}</div>`:''}${fields.length?`<div class="field-grid">${fields.map(([key,label])=>`<div class="field-read"><small>${label.toUpperCase()}</small><p>${key==='date'?fmtDate(r.fields[key]):esc(r.fields[key])}</p></div>`).join('')}</div>`:''}<div class="prose">${r.body?markdown(r.body):'<p class="muted">Ainda sem anotações. Clique em Editar para começar.</p>'}</div>${r.secret?`<details class="secret"><summary>SEGREDOS DO MESTRE / ABRIR</summary><div class="prose">${markdown(r.secret)}</div></details>`:''}<div class="drawer-meta">CRIADO ${fmtDate(r.createdAt)} · ALTERADO ${fmtDate(r.updatedAt)}<br>Suas conexões e checklist ficam nas abas acima.</div>`}
function editForm(r){return `<p class="edit-top-note">As alterações são salvas enquanto você escreve. Fechar o registro mantém a edição.</p><div class="image-edit">${r.image?`<img src="${r.image}" alt="Imagem atual">`:icon('image')}<div><div class="image-buttons"><button class="btn small" data-action="photo-add">${icon('upload')}${r.image?'Trocar imagem':'Adicionar imagem'}</button>${r.image?'<button class="btn small" data-action="photo-remove">Remover</button>':''}</div><p>Imagem do seu computador. Ela acompanha o backup.</p></div></div><div class="form-group"><label class="label" for="f-title">Nome / título</label><input class="control title-input" id="f-title" data-field="title" value="${esc(r.title)}" maxlength="200" placeholder="Dê um nome a esta ideia"></div><div class="form-group"><label class="label" for="f-subtitle">Uma linha sobre este registro</label><input class="control" id="f-subtitle" data-field="subtitle" value="${esc(r.subtitle)}" maxlength="300" placeholder="Papel, conceito ou identificação rápida"></div><div class="form-grid"><div class="form-group"><label class="label" for="f-status">Status</label><select class="control" id="f-status" data-field="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-group"><label class="label" for="f-folder">Pasta</label><select class="control" id="f-folder" data-field="folder"><option value="">Sem pasta</option>${db.folders.map(f=>`<option ${r.folder===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div></div><div class="form-group"><label class="label" for="f-tags">Tags · separe por vírgulas</label><input class="control" id="f-tags" data-field="tags" value="${esc(r.tags.join(', '))}" maxlength="1000" placeholder="Shibuya, mistério, aliado…"></div><div class="form-group"><label class="label" for="f-summary">Resumo para bater o olho</label><textarea class="control" id="f-summary" data-field="summary" maxlength="4000" placeholder="O essencial em poucas linhas…">${esc(r.summary)}</textarea></div><div class="form-grid">${TYPES[r.type].fields.map(([key,label])=>`<div class="form-group"><label class="label" for="f-${key}">${label}</label>${key==='date'?`<input type="date" class="control" id="f-${key}" data-detail="${key}" value="${esc(r.fields[key]||'')}">`:`<textarea class="control" id="f-${key}" data-detail="${key}" maxlength="10000">${esc(r.fields[key]||'')}</textarea>`}</div>`).join('')}</div><div class="form-group"><label class="label" for="f-body">Anotações / conteúdo</label>${formatToolbar('f-body')}<textarea class="control long" id="f-body" data-field="body" maxlength="200000" placeholder="Desenvolva a ideia. Use os botões para organizar o texto.">${esc(r.body)}</textarea><p class="form-help">**negrito**, *itálico*, ## título e - lista aparecem formatados na leitura.</p></div><div class="form-group"><label class="label" for="f-secret">Segredos do mestre</label>${formatToolbar('f-secret')}<textarea class="control" style="min-height:130px" id="f-secret" data-field="secret" maxlength="200000" placeholder="Intenções ocultas, revelações, o que ainda não entrou em cena…">${esc(r.secret)}</textarea><p class="form-help">Ficam recolhidos na leitura para você abrir quando precisar.</p></div>`}
function formatToolbar(target){return `<div class="format-bar"><button data-format="bold" data-target="${target}" title="Negrito" aria-label="Negrito"><b>B</b></button><button data-format="italic" data-target="${target}" title="Itálico" aria-label="Itálico"><i>I</i></button><button data-format="heading" data-target="${target}" title="Título" aria-label="Adicionar título">H2</button><button data-format="list" data-target="${target}" title="Lista" aria-label="Adicionar lista">≡</button><button data-format="quote" data-target="${target}" title="Citação" aria-label="Adicionar citação">❞</button><small>TEXTO FORMATADO</small></div>`}
function captureDraft(){if(!editMode||!editId)return;const r=byId(editId);if(!draft)draft=JSON.parse(JSON.stringify(r));document.querySelectorAll('#editor [data-field]').forEach(el=>{draft[el.dataset.field]=el.dataset.field==='tags'?[...new Set(el.value.split(',').map(x=>x.trim()).filter(Boolean))].slice(0,30):el.value});document.querySelectorAll('#editor [data-detail]').forEach(el=>draft.fields[el.dataset.detail]=el.value)}
function commitDraft(){if(!editMode||!editId)return;captureDraft();const r=byId(editId);if(!r||!draft)return;const copy={...draft,title:draft.title.trim()||'Sem título'};for(const key of ['title','subtitle','status','folder','tags','summary','body','secret','fields','image'])r[key]=copy[key];changeRecord(r)}
function closeEditor(rerender=true){if(editMode)commitDraft();editMode=false;editId=null;draft=null;$('editor').innerHTML='';if(rerender)render();returnFocus?.focus?.()}
function linksPanel(r){const candidates=activeRecords().filter(x=>x.id!==r.id&&!r.links.some(l=>l.target===x.id)).sort((a,b)=>a.title.localeCompare(b.title,'pt-BR')),back=db.records.filter(x=>!x.deleted&&x.id!==r.id&&x.links.some(l=>l.target===r.id));return `<h2 style="font-size:24px;letter-spacing:-.8px">Nada existe sozinho.</h2><p class="preparation-note">Escreva a relação entre este registro e outro. A conexão também aparece como referência no destino.</p>${r.links.length?r.links.map((l,i)=>{const t=byId(l.target);if(!t)return '';return `<div class="link-row">${icon(t.type)}<div><small>${esc(l.label)}${t.archived?' · ARQUIVADO':t.deleted?' · NA LIXEIRA':''}</small><button class="link-open" data-open="${t.id}">${esc(t.title)}</button></div>${!r.deleted?`<button class="icon-btn" data-unlink="${i}" aria-label="Remover conexão com ${esc(t.title)}">${icon('close')}</button>`:''}</div>`}).join(''):emptyInline('Nenhuma conexão criada neste registro ainda.')}${!r.deleted?`<form class="link-form" id="linkForm"><h3>Conectar a outro registro</h3><div class="form-group"><label class="label" for="linkTarget">Registro</label><select class="control" id="linkTarget" required ${!candidates.length?'disabled':''}>${candidates.length?'<option value="">Escolha um registro…</option>':'<option>Crie outro registro para conectar</option>'}${candidates.map(x=>`<option value="${x.id}">${TYPES[x.type].one} / ${esc(x.title)}</option>`).join('')}</select></div><div class="form-group"><label class="label" for="linkLabel">Qual é a relação?</label><input class="control" id="linkLabel" placeholder="Ex.: trabalha para, investiga, acontece em…" maxlength="120" required></div><button class="btn primary" type="submit" ${!candidates.length?'disabled':''}>${icon('link')} Criar conexão</button></form>`:''}${back.length?`<h3 class="backlinks-title">MENCIONADO POR / ${back.length} REGISTROS</h3>${back.map(x=>`<div class="link-row">${icon(x.type)}<div><button class="link-open" data-open="${x.id}">${esc(x.title)}</button><small>${esc(x.links.filter(l=>l.target===r.id).map(l=>l.label).join(', '))}${x.archived?' · ARQUIVADO':''}</small></div>${icon('arrow')}</div>`).join('')}`:''}`}
function tasksPanel(r){const done=r.tasks.filter(t=>t.done).length;return `<h2 style="font-size:24px;letter-spacing:-.8px">Pronto para entrar em cena?</h2><p class="preparation-note">Uma lista sua: cenas a preparar, revelações para plantar ou detalhes que faltam resolver.</p><div class="progress"><i style="width:${r.tasks.length?done/r.tasks.length*100:0}%"></i></div><div class="progress-note" style="margin-bottom:20px"><span>PREPARAÇÃO</span><span>${done} / ${r.tasks.length} CONCLUÍDOS</span></div>${r.tasks.length?r.tasks.map((t,i)=>`<div class="task ${t.done?'done':''}"><input id="task-${i}" type="checkbox" data-task="${i}" ${t.done?'checked':''} ${r.deleted?'disabled':''}><label for="task-${i}">${esc(t.text)}</label>${!r.deleted?`<button class="icon-btn" data-task-remove="${i}" aria-label="Remover tarefa: ${esc(t.text)}">${icon('close')}</button>`:''}</div>`).join(''):emptyInline('A lista está aberta. Qual é o primeiro detalhe que você quer preparar?')}${!r.deleted?`<form class="task-form" id="taskForm"><input class="control" id="taskText" placeholder="Adicionar algo à preparação…" aria-label="Nova tarefa" maxlength="1000" required><button class="btn primary" type="submit" aria-label="Adicionar tarefa">${icon('plus')}</button></form>`:''}`}
function modal(title,content,footer=''){modalRestoreFocus=document.activeElement;$('dialog').innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button class="icon-btn" data-action="modal-close" aria-label="Fechar janela">${icon('close')}</button></div><div class="dialog-body">${content}</div>${footer?`<div class="dialog-foot">${footer}</div>`:''}`;if(!$('dialog').open)$('dialog').showModal()}
function confirmModal(title,content,button,fn){modal(title,`<p style="font-size:12px;line-height:1.8;margin:0">${esc(content)}</p>`,`<button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" id="confirmAction">${esc(button)}</button>`);$('confirmAction').onclick=async()=>{closeModal();await fn()}}
function closeModal(){$('dialog').close();modalRestoreFocus?.focus?.()}
function newPicker(){modal('O que entra na história?',`<p class="preparation-note">Escolha o tipo de registro. Você pode começar só com um nome e desenvolver depois.</p><div class="type-picker">${Object.entries(TYPES).map(([key,t])=>`<button class="type-choice" data-new-type="${key}">${icon(key)}<span><b>${t.one}</b><small>${t.hint}</small></span></button>`).join('')}</div>`)}
function newRecord(type){if(editMode)commitDraft();closeModal();const r=record(type,'Sem título');if(ui.page==='folder')r.folder=ui.folder;db.records.unshift(r);markDirty();render();openEditor(r.id);draft=JSON.parse(JSON.stringify(r));editMode=true;drawEditor();$('f-title').focus();$('f-title').select()}
function newFolder(){modal('Nova pasta',`<form id="folderForm"><label class="label" for="folderName">Nome da pasta</label><input class="control" id="folderName" placeholder="Ex.: Arco 01, Amanogawa, Bastidores…" maxlength="80" required><p class="form-help">As pastas agrupam registros de qualquer tipo.</p><button class="btn primary" style="margin-top:20px" type="submit">Criar pasta</button></form>`)}
function manageFolder(){const old=ui.folder;modal('Organizar pasta',`<form id="renameFolderForm"><label class="label" for="folderName">Nome da pasta</label><input class="control" id="folderName" value="${esc(old)}" maxlength="80" required><button class="btn primary" style="margin-top:17px" type="submit">Salvar nome</button></form><div class="settings-section"><p>Retirar a pasta mantém todos os registros no arquivo.</p><button class="btn danger" id="removeFolder">Retirar pasta</button></div>`);$('renameFolderForm').onsubmit=e=>{e.preventDefault();const name=$('folderName').value.trim();if(!name)return;if(name!==old&&db.folders.includes(name)){toast('Já existe uma pasta com esse nome.',true);return}db.folders=db.folders.map(x=>x===old?name:x);db.records.forEach(r=>{if(r.folder===old)r.folder=name});ui.folder=name;markDirty();closeModal();render()};$('removeFolder').onclick=()=>{db.folders=db.folders.filter(f=>f!==old);db.records.forEach(r=>{if(r.folder===old)r.folder=''});markDirty();closeModal();navigate('all');toast('Pasta retirada. Todos os registros foram mantidos.')}}
function settings(){modal('Campanha e backups',`<form id="settingsForm"><div class="form-group"><label class="label" for="campaignName">Nome da campanha</label><input class="control" id="campaignName" maxlength="120" value="${esc(db.meta.name)}" required></div><div class="form-group"><label class="label" for="campaignSubtitle">Descrição do arquivo</label><input class="control" id="campaignSubtitle" maxlength="240" value="${esc(db.meta.subtitle)}"></div><div class="form-group"><label class="label" for="campaignDate">Data da história</label><input class="control" type="date" id="campaignDate" value="${esc(db.meta.campaignDate)}" required></div><button class="btn primary" type="submit">Salvar campanha</button></form><div class="settings-section"><h3>Seu arquivo, com você</h3><p>O salvamento automático fica neste navegador. Para levar o arquivo a outro computador ou guardar uma cópia, use uma das opções abaixo.</p><div class="action-row"><button class="btn" data-action="export">${icon('download')} Exportar JSON</button><button class="btn" data-action="import">${icon('upload')} Importar JSON</button><button class="btn dark" data-action="export-html">${icon('download')} HTML com meus dados</button></div><p>O JSON inclui textos, retratos, conexões e checklists. O HTML com dados abre sua campanha completa mesmo offline.</p></div><div class="settings-section"><h3>Aparência</h3><div class="theme-switch"><button class="btn ${db.meta.theme==='cream'?'active':''}" data-theme="cream">Tokyo cream</button><button class="btn ${db.meta.theme==='night'?'active':''}" data-theme="night">Midnight signal</button></div></div><div class="settings-section"><h3>Recuperação</h3><p>Antes de uma importação, guardamos uma cópia do arquivo atual neste navegador.</p><button class="btn" data-action="recover">Restaurar antes da última importação</button></div><div class="settings-section"><h3>Como funciona</h3><p>Este HTML é independente da ficha. Os dados não são enviados para um servidor. “Segredos do mestre” organiza a leitura; o arquivo não tem senha ou criptografia. Use em um dispositivo seu e compartilhe backups só se quiser compartilhar seu conteúdo.</p><button class="btn small" data-action="help">Guia rápido</button></div>`)}
function help(){modal('Seu espaço de bastidor',`<ol class="help-list"><li><b>Comece com qualquer peça.</b> Novo registro cria NPCs, lore, arcos, sessões, locais, facções e pistas.</li><li><b>Escreva em camadas.</b> Resumo para consultar rápido, anotações para desenvolver e segredos recolhidos na leitura.</li><li><b>Puxe os fios.</b> Em Conexões, escolha outro registro e descreva a relação. O destino mostra quem aponta para ele.</li><li><b>Prepare a sessão.</b> Use checklists, favoritos e pastas. Arcos têm quadro por status; sessões têm linha do tempo.</li><li><b>Guarde uma cópia.</b> Exporte JSON regularmente. “HTML com meus dados” leva o aplicativo e a campanha juntos.</li></ol><p class="form-help">Ctrl + K: buscar · Ctrl + N: novo registro · Esc: fechar.<br>Arquivar guarda fora da vista; a lixeira permite restaurar.</p>`)}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.hidden=true;($('dialog').open?$('dialog'):document.body).appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function safeFilename(){return db.meta.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_').slice(0,60)||'Phobia'}
function exportJSON(){if(editMode)commitDraft();download(`${safeFilename()}_Backstage_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(db,null,2),'application/json');toast('Backup JSON gerado com imagens e conexões.')}
function exportHTML(){if(editMode)commitDraft();const root=document.documentElement.cloneNode(true),embedded=root.querySelector('#embeddedData');embedded.textContent=JSON.stringify(db).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');root.querySelector('#app').innerHTML='<div class="loading"><strong>BACKSTAGE // PHOBIA</strong>ABRINDO SEU ARQUIVO…</div>';root.querySelector('#editor').innerHTML='';root.querySelector('#dialog').removeAttribute('open');root.querySelector('#dialog').innerHTML='';root.querySelector('#toast').hidden=true;const fileUrl=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+root.outerHTML],{type:'text/html;charset=utf-8'}));modal('Sua campanha em um só arquivo',`<p class="preparation-note">Esta cópia reúne o aplicativo, os textos, imagens, conexões e checklists. Baixe e abra no navegador para continuar mesmo offline.</p><a class="btn primary" href="${fileUrl}" download="${safeFilename()}_Backstage_Com_Dados.html">${icon('download')} Baixar HTML com dados</a>`);setTimeout(()=>URL.revokeObjectURL(fileUrl),600000)}
async function storeRecovery(value){if(persistence==='indexeddb')await dbPut('recovery',value);else if(persistence==='localstorage')localStorage.setItem(STORAGE_KEY+':recovery',JSON.stringify(value));else throw Error('Armazenamento indisponível')}
async function replaceData(value){try{if(editMode)commitDraft();await storeRecovery(JSON.parse(JSON.stringify(db)));await persistSnapshot(value);db=value;dirty=false;ui.query='';ui.page='dashboard';ui.status='all';ui.tag='all';closeEditor(false);closeModal();render();toast('Arquivo importado. A versão anterior está em Recuperação.')}catch{toast('Não foi possível guardar uma cópia de recuperação. A importação foi cancelada; seus dados foram mantidos.',true)}}
async function importFile(file){if(!file)return;try{if(file.size>50000000)throw Error('O backup deve ter no máximo 50 MB.');const parsed=validate(JSON.parse(await file.text()));confirmModal('Importar este arquivo?',`“${parsed.meta.name}” contém ${parsed.records.length} registros. A importação substitui o arquivo aberto. Uma cópia anterior será guardada em Recuperação.`, 'Importar arquivo',()=>replaceData(parsed))}catch(e){toast(e instanceof SyntaxError?'O arquivo não contém um JSON válido.':e.message,true)}finally{$('importFile').value=''}}
async function recover(){try{const value=persistence==='indexeddb'?await dbGet('recovery'):JSON.parse(localStorage.getItem(STORAGE_KEY+':recovery')||'null');if(!value){toast('Não há importação anterior para restaurar.');return}const parsed=validate(value);confirmModal('Restaurar a cópia anterior?',`A cópia tem ${parsed.records.length} registros da campanha “${parsed.meta.name}”. O arquivo atual ficará no lugar da cópia de recuperação.`, 'Restaurar cópia',()=>replaceData(parsed))}catch{toast('A cópia de recuperação não pôde ser lida.',true)}}
async function handlePhoto(file){if(!file||!editId)return;if(file.size>20000000){toast('Escolha uma imagem de até 20 MB.',true);return}if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('Use uma imagem PNG, JPEG ou WebP.',true);return}pendingPhoto=true;const target=editId;try{const image=await createImageBitmap(file,{imageOrientation:'from-image'});const ratio=Math.min(1,1400/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);image.close();const data=canvas.toDataURL('image/webp',.85),r=byId(target);if(!r)throw Error();r.image=data;changeRecord(r);if(editId===target){captureDraft();if(draft)draft.image=data;drawEditor()}toast('Imagem adicionada. Ela será incluída nos backups.')}catch{toast('Não foi possível abrir essa imagem.',true)}finally{pendingPhoto=false;$('photoFile').value=''}}
function formatText(button){const area=$(button.dataset.target);if(!area)return;const start=area.selectionStart,end=area.selectionEnd,value=area.value,selected=value.slice(start,end)||'texto';let insertion;if(button.dataset.format==='bold')insertion='**'+selected+'**';else if(button.dataset.format==='italic')insertion='*'+selected+'*';else{const prefix={heading:'## ',list:'- ',quote:'> '}[button.dataset.format];insertion=(start&&value[start-1]!=='\n'?'\n':'')+selected.split('\n').map(line=>prefix+line).join('\n')}area.setRangeText(insertion,start,end,'select');area.focus();area.dispatchEvent(new Event('input',{bubbles:true}))}
function toggleFavorite(id){const r=byId(id);if(!r||r.deleted)return;r.favorite=!r.favorite;changeRecord(r);render();if(editId===id)drawEditor()}
function recordAction(action){const r=byId(editId);if(!r)return;if(editMode)commitDraft();if(action==='record-duplicate'){const copy=JSON.parse(JSON.stringify(r));copy.id=uid();copy.title=r.title+' — cópia';copy.createdAt=copy.updatedAt=now();copy.example=false;copy.archived=false;copy.deleted=false;copy.favorite=false;db.records.unshift(copy);markDirty();render();openEditor(copy.id);toast('Cópia criada.')}else if(action==='record-archive'){r.archived=!r.archived;changeRecord(r);closeEditor();toast(r.archived?'Registro arquivado.':'Registro voltou ao arquivo.')}else if(action==='record-delete'){r.deleted=true;changeRecord(r);closeEditor();toast('Movido para a lixeira. Você pode restaurar depois.')}else if(action==='record-restore'){r.deleted=false;r.archived=false;changeRecord(r);render();drawEditor();toast('Registro restaurado.')}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-overlay],[data-folder],[data-nav],[data-open]');if(!b)return;if(b.matches('[data-overlay]')){if(e.target===b)closeEditor();return}if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.folder!==undefined){navigate('folder',b.dataset.folder);return}if(b.dataset.open){openEditor(b.dataset.open,b.dataset.tab||'record');return}if(b.dataset.newType){newRecord(b.dataset.newType);return}if(b.dataset.favorite){toggleFavorite(b.dataset.favorite);return}if(b.dataset.view){ui.view=b.dataset.view;renderMain();return}if(b.dataset.move){const r=byId(b.dataset.move);r.status=b.dataset.status;changeRecord(r);renderMain();return}if(b.dataset.editorTab){if(editMode)commitDraft();editorTab=b.dataset.editorTab;drawEditor();return}if(b.dataset.format){formatText(b);return}if(b.dataset.theme){db.meta.theme=b.dataset.theme;markDirty();render();settings();return}if(b.dataset.unlink!==undefined){const r=byId(editId);r.links.splice(Number(b.dataset.unlink),1);changeRecord(r);drawEditor();return}if(b.dataset.taskRemove!==undefined){const r=byId(editId);r.tasks.splice(Number(b.dataset.taskRemove),1);changeRecord(r);drawEditor();return}const action=b.dataset.action;if(!action)return;if(action.startsWith('record-')){recordAction(action);return}switch(action){case 'new':newPicker();break;case 'sidebar':ui.sidebar=!ui.sidebar;render();break;case 'settings':settings();break;case 'theme':db.meta.theme=db.meta.theme==='cream'?'night':'cream';markDirty();render();break;case 'export':exportJSON();break;case 'export-html':exportHTML();break;case 'import':$('importFile').click();break;case 'recover':recover();break;case 'help':help();break;case 'modal-close':closeModal();break;case 'folder-new':newFolder();break;case 'folder-manage':manageFolder();break;case 'editor-close':closeEditor();break;case 'editor-favorite':toggleFavorite(editId);break;case 'edit-toggle':if(editMode){commitDraft();editMode=false;draft=null;render();drawEditor()}else{draft=JSON.parse(JSON.stringify(byId(editId)));editMode=true;editorTab='record';drawEditor();$('f-title')?.focus()}break;case 'photo-add':$('photoFile').click();break;case 'photo-remove':captureDraft();draft.image='';byId(editId).image='';changeRecord(byId(editId));drawEditor();break;case 'clear-filters':ui.query='';ui.status='all';ui.tag='all';render();break;case 'clear-examples':confirmModal('Retirar registros de exemplo?','Só os exemplos que você ainda não editou serão retirados. Os seus registros ficam no arquivo. Os exemplos retirados poderão ser restaurados pela lixeira.','Retirar exemplos',()=>{db.records.forEach(r=>{if(r.example)r.deleted=true});markDirty();render();toast('Exemplos movidos para a lixeira.')});break}});
function renderMain(){const el=$('main');if(el)el.innerHTML=renderPage()}
document.addEventListener('input',e=>{const el=e.target;if(el.id==='globalSearch'){ui.query=el.value;renderMain();return}if(el.id==='quickNote'){db.meta.note=el.value;markDirty();return}if(el.closest('#editor')&&(el.dataset.field||el.dataset.detail)){captureDraft();commitDraft();return}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='statusFilter'){ui.status=el.value;renderMain()}else if(el.id==='tagFilter'){ui.tag=el.value;renderMain()}else if(el.id==='sortFilter'){ui.sort=el.value;renderMain()}else if(el.id==='importFile')importFile(el.files[0]);else if(el.id==='photoFile')handlePhoto(el.files[0]);else if(el.dataset.task!==undefined){const r=byId(editId);r.tasks[Number(el.dataset.task)].done=el.checked;changeRecord(r);drawEditor()}else if(el.closest('#editor')&&(el.dataset.field||el.dataset.detail)){captureDraft();commitDraft()}});
document.addEventListener('submit',e=>{const form=e.target;if(!['taskForm','linkForm','settingsForm','folderForm','renameFolderForm'].includes(form.id))return;e.preventDefault();if(form.id==='taskForm'){const text=$('taskText').value.trim();if(!text)return;const r=byId(editId);r.tasks.push({id:uid(),text,done:false});changeRecord(r);drawEditor();$('taskText').focus()}else if(form.id==='linkForm'){const target=$('linkTarget').value,label=$('linkLabel').value.trim();const r=byId(editId);if(!target||!label||r.links.some(l=>l.target===target))return;r.links.push({target,label});changeRecord(r);drawEditor();toast('Conexão criada.')}else if(form.id==='settingsForm'){db.meta.name=$('campaignName').value.trim()||'Persona — Phobia';db.meta.subtitle=$('campaignSubtitle').value.trim();db.meta.campaignDate=$('campaignDate').value||'2000-04-17';markDirty();closeModal();render();toast('Campanha atualizada.')}else if(form.id==='folderForm'){const name=$('folderName').value.trim();if(!name)return;if(db.folders.includes(name)){toast('Já existe uma pasta com esse nome.',true);return}db.folders.push(name);markDirty();closeModal();navigate('folder',name)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('dialog').open){closeEditor();$('globalSearch').focus()}}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();if(!$('dialog').open)newPicker()}else if(e.key==='Escape'&&!$('dialog').open){if(editId){e.preventDefault();closeEditor()}else if(ui.sidebar){ui.sidebar=false;render()}}if(e.key==='Tab'&&editId&&!$('dialog').open){const elements=[...$('editor').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(el=>el.getClientRects().length);if(!elements.length)return;const first=elements[0],last=elements.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('drawer'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('dialog').addEventListener('close',()=>modalRestoreFocus?.focus?.());$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const rect=$('dialog').getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeModal()}});
window.addEventListener('beforeunload',e=>{if(dirty||pendingPhoto){flushSave();e.preventDefault();e.returnValue=''}});document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave()});
const channel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel(STORAGE_KEY):null;
if(channel)channel.onmessage=async e=>{if(e.data?.type!=='saved'||!db||e.data.stamp===db.meta.updatedAt)return;if(dirty||editId){externalConflict=true;showSaveError('Outra aba alterou seu arquivo. Exporte suas alterações e recarregue esta aba antes de continuar.');return}try{const loaded=await (persistence==='indexeddb'?dbGet('current'):JSON.parse(localStorage.getItem(STORAGE_KEY)));if(loaded){db=validate(loaded);render();toast('Arquivo atualizado a partir de outra aba.')}}catch{showSaveError('Não foi possível atualizar o arquivo a partir da outra aba.')}};
(async()=>{let embedded=null,loaded=null,problem=false;try{embedded=JSON.parse($('embeddedData').textContent||'null');if(embedded)embedded=validate(embedded)}catch{problem=true}try{const raw=await openStore();if(raw)loaded=validate(raw)}catch{problem=true}if(embedded&&(!loaded||embedded.meta.updatedAt>loaded.meta.updatedAt)){db=embedded;dirty=true}else db=loaded||embedded||starter();render();if(problem)showSaveError('Uma cópia não pôde ser lida. Não foi substituída automaticamente; exporte o arquivo aberto antes de importar um backup.');else if(persistence==='memory')showSaveError('O navegador não permitiu salvar neste dispositivo. Use Exportar JSON ou HTML com meus dados para guardar seu arquivo.');if(!loaded&&!problem){dirty=true;flushSave()}else if(dirty&&!problem)flushSave()})();
</script>
</body>
</html>
